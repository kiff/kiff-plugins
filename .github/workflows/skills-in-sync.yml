name: skills-in-sync

# The skills in this plugin are copies of the ones kiff.dev serves. A copy
# that drifts teaches agents an old protocol, so this fails when they differ.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare each skill with kiff.dev
        run: |
          set -uo pipefail
          status=0
          for name in kiff kiff-domains; do
            url="https://kiff.dev/skills/${name}.md"
            code=$(curl -sSL -o "/tmp/${name}.md" -w '%{http_code}' "$url")
            if [ "$code" != "200" ]; then
              echo "::error file=plugins/kiff-cards/skills/${name}/SKILL.md::${url} answered ${code}: the skill is not published on kiff.dev (not deployed yet?)"
              status=1
              continue
            fi
            if ! diff -u "plugins/kiff-cards/skills/${name}/SKILL.md" "/tmp/${name}.md"; then
              echo "::error file=plugins/kiff-cards/skills/${name}/SKILL.md::differs from ${url}"
              status=1
            fi
          done
          exit $status
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/kiff-cards/.claude-plugin/plugin.json plugins/kiff-cards/.mcp.json; do
            python3 -m json.tool "$f" > /dev/null
          done
